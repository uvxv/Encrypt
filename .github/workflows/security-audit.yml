name: Python Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Bandit & pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install security audit tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit static security analysis
        run: |
          bandit -r . --exclude ./.git,./build,./dist,./.venv -f txt

      - name: Run pip-audit dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt --strict --desc

      - name: Install runtime dependencies & verify crypto integrity
        run: |
          pip install -r requirements.txt
          python - <<'EOF'
          import os
          import tempfile
          from moduleAES import AESfile, AEStxt, DecryptionError

          tok = AEStxt.encryption("audit-pass", "integrity-check")
          assert AEStxt.decryption("audit-pass", tok) == "integrity-check"

          with tempfile.TemporaryDirectory() as d:
              src = os.path.join(d, "sample.bin")
              enc = src + ".aes"
              payload = os.urandom(128 * 1024)
              with open(src, "wb") as f:
                  f.write(payload)
              AESfile.encrypt_file(src, enc, "audit-pass")
              assert not os.path.exists(src) and os.path.exists(enc)
              try:
                  AESfile.decrypt_file(enc, src, "wrong-pass")
                  raise AssertionError("Expected DecryptionError")
              except DecryptionError:
                  pass
              AESfile.decrypt_file(enc, src, "audit-pass")
              with open(src, "rb") as f:
                  assert f.read() == payload
          print("Crypto integrity smoke test passed.")
          EOF
